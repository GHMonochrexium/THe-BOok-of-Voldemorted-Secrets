[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/diary/reply to the Netlify Serverless Function
[[redirects]]
  from = "/api/diary/reply"
  to = "/.netlify/functions/diary-reply"
  status = 200

# Single Page App routing for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
